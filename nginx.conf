# Nginx конфигурация для fileconvert
# Скопировать в: /etc/nginx/sites-available/fileconvert

server {
    listen 80;
    server_name _;  # Заменить на свой домен

    # Лимиты загрузки
    client_max_body_size 100M;

    # Логи
    access_log /var/log/nginx/fileconvert.access.log;
    error_log /var/log/nginx/fileconvert.error.log;

    # Проксирование на Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты для больших файлов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

